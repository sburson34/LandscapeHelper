<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Landscape Advice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Landscape Helper</h1>
        <p class="subtitle">Your saved house advice</p>
      </div>
      <div id="user-bar" class="user-bar hidden">
        <span id="user-email"></span>
        <button id="logout-btn" class="ghost-btn">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Auth (login + register) -->
    <section id="auth-section" class="auth-section">
      <div class="auth-card">
        <div class="tab-row">
          <button class="tab-btn active" data-tab="login">Sign in</button>
          <button class="tab-btn" data-tab="register">Create account</button>
        </div>

        <form id="login-form" class="auth-form">
          <label>Email
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label>Password
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <button class="primary-btn" type="submit">Sign in</button>
          <p id="login-error" class="error-text"></p>
        </form>

        <form id="register-form" class="auth-form hidden">
          <label>Email
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label>Display name (optional)
            <input type="text" name="displayName" autocomplete="name">
          </label>
          <label>Password (8+ characters)
            <input type="password" name="password" required minlength="8" autocomplete="new-password">
          </label>
          <button class="primary-btn" type="submit">Create account</button>
          <p id="register-error" class="error-text"></p>
        </form>
      </div>
    </section>

    <!-- Logged-in dashboard -->
    <section id="dashboard-section" class="hidden">
      <h2>Your house advice history</h2>
      <p class="muted">Each card is a whole-house consultation you've requested from the app.</p>
      <div id="session-list" class="session-list"></div>
    </section>

    <!-- Detail view -->
    <section id="detail-section" class="hidden">
      <button id="back-btn" class="ghost-btn">&larr; Back to list</button>
      <div id="detail-content"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
