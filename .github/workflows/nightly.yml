name: Nightly extended

# Extended suite. Runs once per night on main. Intended for checks that are
# too slow or too flaky-prone to run on every push — flaky detection via
# repeat runs and a publish-deploy dry run.

on:
  # schedule cron disabled pre-launch — re-enable at launch
  # schedule:
  #   - cron: '0 7 * * *'   # 07:00 UTC = 03:00 ET
  workflow_dispatch:

jobs:
  flaky-detect-frontend:
    name: Flaky detect (Jest x3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --legacy-peer-deps

      - name: Run Jest 3 times in a row
        # A single flake can be masked by retry-on-fail runners. Running the
        # same suite back-to-back in one job exposes tests that depend on
        # ordering, stale globals, or timer races.
        run: |
          for i in 1 2 3; do
            echo "=== Jest run #$i ==="
            npm test -- --ci || exit 1
          done

  flaky-detect-backend:
    name: Flaky detect (xUnit x3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - run: dotnet restore LandscapeHelper.slnx

      - name: Run xUnit 3 times in a row
        run: |
          for i in 1 2 3; do
            echo "=== xUnit run #$i ==="
            dotnet test LandscapeHelper.slnx --logger "console;verbosity=minimal" || exit 1
          done

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: npm audit (app)
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm audit --audit-level=high --omit=dev || true

      - name: dotnet vulnerable packages (backend)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet restore LandscapeHelper.slnx
          OUTPUT=$(dotnet list LandscapeHelper.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "has the following vulnerable packages"; then
            echo "::error::dotnet reported vulnerable NuGet packages in backend"
            exit 1
          fi
