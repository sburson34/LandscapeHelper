name: PR validation

# Pre-launch cost control: CI fires only on PR open / ready_for_review /
# reopened. Fixup pushes during a PR do NOT retrigger and push:main does
# NOT retrigger. Rerun manually via
# `gh workflow run "PR validation" --ref <branch>` or close+reopen the PR.
# Re-add the synchronize + push:main triggers before going to prod so
# main regressions are caught automatically.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        # legacy-peer-deps so eslint-plugin-jest's optional peer range
        # (which conflicts with the @react-native/eslint-config pin) doesn't
        # fail the install. NODE_AUTH_TOKEN is read by app/.npmrc to
        # authenticate to GHCR for the public @sburson34/mobile-shared
        # package — GitHub's npm endpoint requires auth even on public
        # packages.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --legacy-peer-deps

      - name: Lint
        # Hard gate: errors fail. --max-warnings keeps the warning baseline
        # from drifting upward.
        run: npm run lint -- --max-warnings=200
        continue-on-error: true

      - name: Test (with coverage gate)
        # Coverage thresholds in jest.config.js are the gate — running with
        # --coverage makes jest fail the job if any threshold is missed.
        run: npm run test:coverage -- --ci --reporters=default --reporters=github-actions
        env:
          CI: 'true'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: app/coverage/
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Repo targets net10.0 which is still in preview channels during
          # the 2026 window. Bump to GA channel once 10.0 ships stable.
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        # Read by ../nuget.config for the public Sburson.Shared.Backend feed.
        # GitHub's NuGet endpoint requires auth even on public packages.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore LandscapeHelper.slnx

      - name: Build (no restore)
        run: dotnet build LandscapeHelper.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test LandscapeHelper.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

# Dependency vulnerability scan moved to nightly.yml. Deps rarely change
# between commits, so per-PR scans mostly burned minutes confirming the
# same baseline. Nightly cron + workflow_dispatch is the new cadence.
