name: E2E (Maestro)

# Manual-dispatch only. Android emulators on GitHub-hosted runners take
# 10-20 min to boot and are prone to unrelated failures, so we don't gate
# PRs on this. Run before cutting a release or when touching navigation
# / screen-mount paths.

on:
  # Dispatch-only. Maestro on macos-latest is 10x the Linux runner rate,
  # and the Expo managed app has no app/android until `expo prebuild` runs —
  # so the PR trigger was burning ~5 effective minutes per PR for a
  # fail-fast no-op. Run manually before a release or when touching
  # navigation / screen-mount paths.
  workflow_dispatch:
    inputs:
      run_golden_path:
        description: 'Also run the whole-house-analyze flow (requires live backend)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  maestro:
    name: Maestro (Android emulator)
    # ubuntu-latest (1× billing). KVM is available on GitHub-hosted Linux
    # runners; the "Enable KVM" step below grants the runner user access so
    # the x86_64 emulator boots with hardware acceleration.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install app dependencies
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --legacy-peer-deps

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Start emulator + run offline flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk
            cd app
            # Offline flows: no backend required.
            maestro test maestro/smoke-launch.yaml
            maestro test maestro/login.yaml
            maestro test maestro/settings.yaml

      - name: Run golden-path (optional, needs live backend)
        if: ${{ inputs.run_golden_path == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            cd app
            maestro test maestro/shrubbery-analyze.yaml
            maestro test maestro/whole-house-analyze.yaml

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests/**/*
          if-no-files-found: ignore
          retention-days: 14
